<style>

.slot.on{background:var(--ac);border-color:var(--ac);color:#fff}.slot:disabled{background:#f1f4f8;color:#a6b2c3;text-decoration:line-through;cursor:not-allowed;border-color:#f1f4f8}

.chat{background:#ece5dd;border-radius:var(--r);padding:14px}.m{margin-bottom:12px}.meta{font-size:11.5px;color:#6b7a70;margin:0 4px 4px}.m.out .meta{text-align:right}
.bub{background:#d9fdd3;border-radius:12px 2px 12px 12px;padding:9px 12px;font-size:14px;white-space:pre-wrap;box-shadow:0 1px 1px #0001;max-width:88%;margin-left:auto;color:#0b1f12}

.kb{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 8px}.kc{flex:0 0 84%;scroll-snap-align:start;background:#e9edf3;border-radius:var(--r);padding:12px}
.kc h2{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;margin:3px 4px 12px}
.oc{background:var(--s);border-radius:14px;padding:13px;margin-bottom:8px;box-shadow:0 1px 2px #0c1a2b0d}.oc .btn{margin-top:10px}.empty{color:var(--mut);font-size:13px;padding:18px;text-align:center}
.pl{display:grid;gap:12px}.fu{display:flex;align-items:center;gap:8px}.fu input{height:36px;width:auto;border-radius:10px;font-size:13px}.due{border-color:#f3c9a8}

.rs{width:100%;margin-top:26px;color:var(--mut);font-size:12.5px;font-weight:600;text-decoration:underline;padding:10px}
.ofrm{display:grid;gap:0 12px}
@media(min-width:900px){
.side{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:268px;padding:26px 18px 20px;background:var(--s);border-right:1px solid var(--ln);gap:4px}
.side .sw{flex-direction:column;margin:20px 0 8px}.side .lg{align-self:flex-start;margin-bottom:12px}
.ni{display:flex;align-items:center;gap:12px;height:44px;padding:0 13px;border-radius:12px;font-weight:700;color:var(--mut);width:100%;text-align:left}.ni:hover{background:#f4f6fa}.ni.on{background:var(--ac-t);color:var(--ac)}
.main{margin-left:268px;padding:30px 40px 60px}.mt,.bn,.dm,.rm{display:none}.ph{margin-top:0}h1{font-size:30px}
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.cols{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}.cols.eq{grid-template-columns:1fr 1fr}.cols.bk{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}.cols.bk>.card:last-child{position:sticky;top:24px}
.slots{grid-template-columns:repeat(6,1fr)}.kb{margin:0;padding:0;overflow:visible}.kc{flex:1}.pl{grid-template-columns:1fr 1fr}.ofrm{grid-template-columns:1.3fr 1.6fr 1fr auto;align-items:end}.ofrm .btn{margin:0;width:auto}#toast{bottom:32px}}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>

const K='clinicremind.v1',$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),uid=()=>Math.random().toString(36).slice(2,9);
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return dstr(d)};
const nextDay=d=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+1);return dstr(x)};
const fd=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fp=p=>String(p).replace(/(\d{5})(\d{5})/,'$1 $2'),inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const SLOTS=[];for(let h=10;h<18;h++)SLOTS.push(pad(h)+':00',pad(h)+':30');
const CL={ic:{n:'I Care Opticals',doc:'Dr. Meera Kapoor'},gc:{n:'General Clinic',doc:'Dr. Arjun Rao'}};
const SL={booked:'Booked',confirmed:'Confirmed',arrived:'Arrived',done:'Completed',resched:'Reschedule asked',noshow:'No-show',cancelled:'Cancelled'};
const ST=['Ordered','In Lab','Ready','Collected'],TT={booking:'Booking confirmation',reminder:'Appointment reminder',followup:'Follow-up reminder',ready:'Order ready',reply:'Patient reply'};
const ITEMS=['Single-vision lenses + frame','Progressive lenses + frame','Blue-cut lenses','Contact lenses (3 months)','Power sunglasses'];
const TPL={
booking:{en:'Hi {name}, your appointment at {clinic} is booked for {date} at {time}. Reply YES to confirm or RESCHEDULE to change it.',hi:'नमस्ते {name}, {clinic} में आपकी अपॉइंटमेंट {date} को {time} बजे बुक हो गई है। कन्फर्म करने के लिए YES या बदलने के लिए RESCHEDULE लिखें।'},
reminder:{en:'Reminder: {name}, you have an appointment at {clinic} on {date} at {time}. Reply YES to confirm or RESCHEDULE.',hi:'याद दिलाना: {name}, {clinic} में {date} को {time} बजे आपकी अपॉइंटमेंट है। YES या RESCHEDULE लिखें।'},
followup:{en:'Hi {name}, it is time for your follow-up visit at {clinic} (due {date}). Reply YES and we will book a slot.',hi:'नमस्ते {name}, {clinic} में आपकी फॉलो-अप विज़िट का समय हो गया है ({date})। स्लॉट बुक करने के लिए YES लिखें।'},
ready:{en:'Good news {name}! Your order ({item}) is ready for collection at {clinic}.',hi:'खुशखबरी {name}! आपका ऑर्डर ({item}) {clinic} में लेने के लिए तैयार है।'}};
let S;
function init(){
 const t=addDays(0),m=addDays(1),pts=[],appts=[],orders=[];
 const P=(c,n,p,fu)=>{const x={id:uid(),c,name:n,phone:p,fu:fu||''};pts.push(x);return x};
 const A=(x,d,tm,r,st)=>appts.push({id:uid(),c:x.c,pid:x.id,name:x.name,phone:x.phone,date:d,time:tm,reason:r,status:st});
 const O=(x,item,price,stage)=>orders.push({id:uid(),c:'ic',pid:x.id,name:x.name,item,price,stage});
 const I=[P('ic','Ananya Sharma','9876500011',t),P('ic','Rohit Verma','9876500012',addDays(5)),P('ic','Sunita Devi','9876500013',addDays(-1)),P('ic','Karan Mehta','9876500014'),P('ic','Pooja Singh','9876500015')];
 const G=[P('gc','Vikram Joshi','9876500021',addDays(7)),P('gc','Neha Gupta','9876500022',addDays(-2)),P('gc','Mohd. Imran','9876500023'),P('gc','Kavita Rao','9876500024'),P('gc','Suresh Yadav','9876500025')];
 A(I[0],t,'10:00','Eye test','done');A(I[1],t,'10:30','Frame fitting','arrived');A(I[2],t,'11:30','Follow-up check','confirmed');A(I[3],t,'14:00','Eye test','booked');A(I[4],m,'11:00','Contact lens trial','booked');
 A(G[0],t,'10:30','Fever','done');A(G[1],t,'11:00','General check-up','confirmed');A(G[2],t,'12:00','BP review','booked');A(G[3],t,'15:30','Skin allergy','booked');A(G[4],m,'10:00','Check-up','booked');
 O(I[0],ITEMS[1],6800,1);O(I[1],ITEMS[0],2400,0);O(I[2],ITEMS[2],3200,2);O(I[3],ITEMS[4],4500,3);O(I[4],ITEMS[3],1800,0);
 S={c:'ic',tab:'book',lang:'en',dd:'today',q:'',tk:'booking',bk:{date:t,time:'',name:'',phone:'',reason:''},of:{pid:'',item:ITEMS[0],price:'',f:-1},done:null,appts,pts,orders,tpl:JSON.parse(JSON.stringify(TPL)),logs:[]};
 appts.filter(a=>a.date===m||a.status==='booked').forEach(a=>send('booking',a));
}
function load(){try{const s=JSON.parse(localStorage.getItem(K));return s&&s.appts?s:null}catch(e){return null}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const fill=(s,v)=>s.replace(/\{(\w+)\}/g,(_,k)=>v[k]==null?'':v[k]);
function send(type,a){const v={name:a.name,clinic:CL[a.c].n,date:a.date?fd(a.date):'',time:a.time||'',item:a.item||''};
 S.logs.unshift({id:uid(),c:a.c,ts:Date.now(),dir:'out',type,lang:S.lang,name:a.name,phone:a.phone,text:fill(S.tpl[type][S.lang],v)})}
const taken=(c,d,t,ex)=>S.appts.some(a=>a.c===c&&a.date===d&&a.time===t&&a.id!==ex&&a.status!=='cancelled');
function reply(a,k){S.logs.unshift({id:uid(),c:a.c,ts:Date.now(),dir:'in',type:'reply',name:a.name,phone:a.phone,text:k});a.status=k==='YES'?'confirmed':'resched'}
function moveNext(a){let d=a.date,i=SLOTS.indexOf(a.time)+1;
 for(let k=0;k<7*SLOTS.length;k++){if(i>=SLOTS.length){i=0;d=nextDay(d)}if(!taken(a.c,d,SLOTS[i],a.id)){a.date=d;a.time=SLOTS[i];a.status='booked';send('booking',a);return true}i++}return false}
function doBook(){const b=S.bk,c=S.c,ph=(b.phone||'').replace(/\D/g,'').slice(-10);
 if(!b.name.trim())return toast('Enter the patient name');
 if(ph.length<10)return toast('Enter a valid 10-digit phone number');
 if(!b.time)return toast('Pick a time slot');
 if(taken(c,b.date,b.time)){b.time='';render();return toast('That slot was just taken — pick another')}
 let p=S.pts.find(x=>x.c===c&&x.phone===ph);if(!p){p={id:uid(),c,name:b.name.trim(),phone:ph,fu:''};S.pts.push(p)}
 const a={id:uid(),c,pid:p.id,name:p.name,phone:ph,date:b.date,time:b.time,reason:b.reason.trim()||'Consultation',status:'booked'};
 S.appts.push(a);send('booking',a);S.done=a.id;S.bk={date:b.date,time:'',name:'',phone:'',reason:''};render();return a}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2400)}
const P={cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',plus:'<path d="M12 5v14M5 12h14"/>',dash:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="4" rx="1.5"/><rect x="13" y="11" width="7" height="9" rx="1.5"/><rect x="4" y="14" width="7" height="6" rx="1.5"/>',pts:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 010 6.4M18 14.3c2 .7 3.5 2.5 3.5 5.7"/>',orders:'<circle cx="6.5" cy="14" r="3.5"/><circle cx="17.5" cy="14" r="3.5"/><path d="M10 14h4M3 14L5 7M21 14l-2-7"/>',msgs:'<path d="M4 5h16v11H9l-5 4z"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',bell:'<path d="M6 16v-5a6 6 0 0112 0v5l1.5 2h-15zM10 21h4"/>',done:'<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8"/>',box:'<path d="M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8"/>',chev:'<path d="M6 9l6 6 6-6"/>'};
const ic=n=>`<svg class=i viewBox="0 0 24 24">${P[n]}</svg>`,ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const ph=(t,s)=>`<div class=ph><div><h1>${t}</h1><p class=sub>${s||''}</p></div></div>`,empty=m=>`<div class=empty>${m}</div>`;
const bub=(t,l)=>`<div class=bub><div class=bt><span class=tag>SIMULATED</span>${l}</div>${esc(t)}</div>`;
const sw=()=>`<div class=sw>${['ic','gc'].map(c=>`<button data-a=clinic data-v=${c} class="${S.c===c?'on':''}" style="--cc:${c==='ic'?'#2455e6':'#0b8a86'}"><i class=dot></i>${CL[c].n}</button>`).join('')}</div>`;
const lg=()=>`<div class=lg>${['en','hi'].map(l=>`<button data-a=lang data-v=${l} class="${S.lang===l?'on':''}">${l==='en'?'EN':'हिं'}</button>`).join('')}</div>`;
const demo='<div class=demo><i></i>Demo: WhatsApp messages are simulated</div>';
const TABS=()=>[['book','Book','plus'],['dash','Today','dash'],['pts','Patients','pts'],['orders','Orders','orders'],['msgs','Messages','msgs']].filter(t=>t[0]!=='orders'||S.c==='ic');
const brand=`<div class=brand><span class=bm>${ic('plus')}</span>ClinicRemind</div>`;
const side=()=>`<aside class=side>${brand}${sw()}${TABS().map(t=>`<button class="ni ${S.tab===t[0]?'on':''}" data-a=tab data-v=${t[0]}>${ic(t[2])}${t[1]}</button>`).join('')}<div class=grow></div>${lg()}${demo}<button class=rs data-a=reset>${rc?'Tap again to confirm':'Reset demo data'}</button></aside>`;
const bn=()=>`<nav class=bn>${TABS().map(t=>`<button data-a=tab data-v=${t[0]} class="${S.tab===t[0]?'on':''}">${ic(t[2])}${t[1]}</button>`).join('')}</nav>`;
const dayopt=d=>new Date(d+'T00:00');
function vBook(){const b=S.bk;
 if(S.done){const a=ap(S.done),l=a&&S.logs.find(x=>x.type==='booking'&&x.name===a.name&&x.c===a.c);
  if(a)return `<div class="card okc"><div class=okic>${ic('check')}</div><h1>Booking confirmed</h1><p class=sub>${esc(a.name)} · ${fd(a.date)} at ${a.time}<br>${CL[a.c].doc} · ${esc(a.reason)}</p><div class=chat style="text-align:left;margin:20px 0">${bub(l?l.text:'','WhatsApp to '+fp(a.phone))}</div><div class=acts><button class=btn data-a=tab data-v=dash>View on dashboard</button><button class="btn o" data-a=again>Book another</button></div></div>`}
 const days=[0,1,2,3,4,5,6].map(addDays),free=SLOTS.filter(t=>!taken(S.c,b.date,t)).length;
 const grp=(l,f)=>`<div class=cap>${l}</div><div class=slots>${SLOTS.filter(f).map(t=>taken(S.c,b.date,t)?`<button class=slot disabled>${t}</button>`:`<button class="slot ${b.time===t?'on':''}" data-a=slot data-v=${t}>${t}</button>`).join('')}</div>`;
 return ph('Book appointment',CL[S.c].n+' · '+CL[S.c].doc)+`<div class="cols bk"><div class=stack><div class=card><h2>Choose a date</h2><div class=dates>${days.map(d=>`<button class="dt ${b.date===d?'on':''}" data-a=bdate data-v=${d}><small>${dayopt(d).toLocaleDateString('en-IN',{weekday:'short'})}</small><b>${dayopt(d).getDate()}</b></button>`).join('')}</div></div>
<div class=card><h2>Available slots <span class=mut>· ${free} free</span></h2>${grp('Morning',t=>t<'13:00')}${grp('Afternoon',t=>t>='13:00')}</div></div>
<div class=card><h2>Patient details</h2><label class=fld style="margin-top:0"><span>Full name</span><input data-in=name value="${esc(b.name)}" placeholder="e.g. Aarti Nair" autocomplete=off></label>
<label class=fld><span>WhatsApp number</span><input data-in=phone type=tel value="${esc(b.phone)}" placeholder="10-digit mobile"></label>
<label class=fld><span>Reason for visit</span><input data-in=reason value="${esc(b.reason)}" placeholder="${S.c==='ic'?'Eye test':'Consultation'}"></label>
<div class=sumr><span>${fd(b.date)}</span><span>${b.time||'Select a slot'}</span></div><button class="btn w" data-a=book>Confirm booking</button></div></div>`}
const card=a=>{const p=pt(a.pid)||{},o=S.open===a.id;return `<div class="card ap"><div class=apr><div class=tm>${a.time}${S.dd==='up'?`<small>${fd(a.date).replace(/^\w+, /,'')}</small>`:''}</div><div class=av>${ini(a.name)}</div><div class=grow><b>${esc(a.name)}</b><div class=mut>${esc(a.reason)} · ${fp(a.phone)}</div></div><span class="pill ${a.status}">${SL[a.status]}</span></div>
<div class=apb><button class="btn sm" data-a=remind data-id=${a.id}>${ic('bell')}Send reminder</button><button class="btn sm o" data-a=open data-id=${a.id}>${o?'Less':'More'}</button></div>
${o?`<div class=apm><div class=g2><label class=fld><span>Status</span><select data-ch=status data-id=${a.id}>${Object.keys(SL).map(k=>`<option value=${k} ${k===a.status?'selected':''}>${SL[k]}</option>`).join('')}</select></label><label class=fld><span>Follow-up${p.fu?' · '+fd(p.fu):''}</span><select data-ch=fu data-id=${p.id}><option value="">Set…</option><option value=7>In 7 days</option><option value=14>In 14 days</option><option value=30>In 30 days</option><option value=0>Clear</option></select></label></div>
<div><div class=cap>Simulate patient reply</div><div class=acts><button class="btn sm o" data-a=yes data-id=${a.id}>Reply “YES”</button><button class="btn sm o" data-a=rs data-id=${a.id}>Reply “RESCHEDULE”</button>${a.status==='resched'?`<button class="btn sm" data-a=move data-id=${a.id}>Move to next free slot</button>`:''}</div></div></div>`:''}</div>`};
function vDash(){const c=S.c,t=addDays(0),L=S.appts.filter(a=>a.c===c),td=L.filter(a=>a.date===t),due=S.pts.filter(p=>p.c===c&&p.fu&&p.fu<=t),n=k=>td.filter(a=>k.includes(a.status)).length;
 const st=[['cal',td.length,'Appointments today'],['check',n(['confirmed','arrived']),'Confirmed or arrived'],['done',n(['done']),'Completed'],['bell',due.length,'Follow-ups due']];if(c==='ic')st.push(['box',S.orders.filter(o=>o.stage===2).length,'Orders ready']);
 const f=S.dd,sh=L.filter(a=>f==='today'?a.date===t:f==='tmr'?a.date===addDays(1):a.date>=t).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
 return ph('Today',new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})+' · '+CL[c].n)+`<div class=stats>${st.map(s=>`<div class=stat><i>${ic(s[0])}</i><b>${s[1]}</b><small>${s[2]}</small></div>`).join('')}</div>
<div class=cols><div><div class=tabs>${[['today','Today'],['tmr','Tomorrow'],['up','All upcoming']].map(x=>`<button class="tb ${f===x[0]?'on':''}" data-a=dd data-v=${x[0]}>${x[1]}</button>`).join('')}</div><div class=stack>${sh.map(card).join('')||empty('No appointments here yet.')}</div></div>
<div><h2 class=sec>Follow-ups due</h2><div class=stack>${due.map(p=>`<div class="card due"><div class=row style="display:flex;align-items:center;gap:12px"><div class=av>${ini(p.name)}</div><div class=grow><b>${esc(p.name)}</b><div class=mut>Due ${fd(p.fu)}</div></div><button class="btn sm s" data-a=ptremind data-id=${p.id}>Remind</button></div></div>`).join('')||empty('Nothing due.')}</div></div></div>`}
const plist=()=>{const q=(S.q||'').toLowerCase(),t=addDays(0);return S.pts.filter(p=>p.c===S.c&&(p.name.toLowerCase().includes(q)||p.phone.includes(q))).sort((a,b)=>(!!(b.fu&&b.fu<=t))-(!!(a.fu&&a.fu<=t))||a.name.localeCompare(b.name)).map(p=>{const v=S.appts.filter(a=>a.pid===p.id&&a.status==='done').length,d=p.fu&&p.fu<=t;
 return `<div class="card ap ${d?'due':''}"><div class=apr><div class=av>${ini(p.name)}</div><div class=grow><b>${esc(p.name)}</b><div class=mut>${fp(p.phone)} · ${v} completed visit${v===1?'':'s'}</div></div>${d?'<span class="pill resched">Follow-up due</span>':''}</div>
<div class=apb><label class=fu><span class=cap style="margin:0">Follow-up</span><input type=date data-ch=ptfu data-id=${p.id} value="${p.fu}"></label>${p.fu?`<button class="btn sm s" data-a=ptremind data-id=${p.id}>Send reminder</button><button class="btn sm o" data-a=ptclear data-id=${p.id}>Clear</button>`:''}</div></div>`}).join('')||empty('No patients found.')};
const vPts=()=>ph('Patients','Added automatically from bookings · follow-up reminders')+`<input data-in=search placeholder="Search by name or number" value="${esc(S.q)}" style="margin-bottom:14px"><div id=plist class=pl>${plist()}</div>`;
function vOrders(){const O=S.orders.filter(o=>o.c==='ic'),pp=S.pts.filter(p=>p.c==='ic');
 return ph('Optical orders','Track every pair from lab to collection')+`<div class="card" style="margin-bottom:18px"><div class=ofrm><label class=fld><span>Patient</span><select data-in=of_pid>${pp.map(p=>`<option value=${p.id} ${S.of.pid===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
<label class=fld><span>Item</span><select data-in=of_item>${ITEMS.map(i=>`<option ${S.of.item===i?'selected':''}>${i}</option>`).join('')}</select></label><label class=fld><span>Price (₹)</span><input data-in=of_price type=number inputmode=numeric value="${esc(S.of.price)}" placeholder="3500"></label><button class="btn w" data-a=ordnew>Create order</button></div></div>
<div class=kb>${ST.map((s,i)=>{const l=O.filter(o=>o.stage===i);return `<div class=kc><h2>${s}<span>${l.length}</span></h2>${l.map(o=>`<div class=oc><b>${esc(o.name)}</b><div class=mut>${esc(o.item)}</div><div style="font-weight:800;margin-top:6px">${inr(o.price)}</div>${i<3?`<button class="btn sm s" data-a=ordnext data-id=${o.id}>Move to ${ST[i+1]}</button>`:''}</div>`).join('')||empty('No orders')}</div>`}).join('')}</div>`}
function vMsgs(){const k=S.tk,tp=S.tpl[k],lo=S.logs.filter(l=>l.c===S.c).slice(0,40);
 return ph('Messages','Editable templates and a log of every simulated WhatsApp message')+`<div class="cols eq"><div><div class=tabs>${Object.keys(TT).filter(x=>x!=='reply').map(x=>`<button class="tb ${k===x?'on':''}" data-a=tk data-v=${x}>${TT[x]}</button>`).join('')}</div>
<div class=card><label class=fld style="margin-top:0"><span>English</span><textarea id=t_en rows=4>${esc(tp.en)}</textarea></label><label class=fld><span>हिन्दी</span><textarea id=t_hi rows=4>${esc(tp.hi)}</textarea></label><p class=mut style="margin:12px 0">Variables: {name} {clinic} {date} {time} {item}. New messages use the language selected (EN / हिं).</p><button class=btn data-a=tplsave>Save template</button></div></div>
<div><h2 class=sec>Message log</h2><div class=chat>${lo.map(l=>`<div class="m ${l.dir}"><div class=meta>${l.dir==='out'?'To':'From'} ${esc(l.name)} · ${TT[l.type]} · ${new Date(l.ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</div>${bub(l.text,l.dir==='out'?'WhatsApp':'Patient reply')}</div>`).join('')||empty('No messages yet.')}</div></div></div>`}
let rc=0;
function render(){document.documentElement.dataset.clinic=S.c;if(S.c==='gc'&&S.tab==='orders')S.tab='dash';
 $('#app').innerHTML=side()+`<div class=main><div class=mi><div class=mt><div class=mtop>${brand}${lg()}</div>${sw()}</div><div class=dm>${demo}</div>${({book:vBook,dash:vDash,pts:vPts,orders:vOrders,msgs:vMsgs}[S.tab])()}<button class="rs rm" data-a=reset>${rc?'Tap again to confirm reset':'Reset demo data'}</button></div></div>`+bn();save()}
const ap=id=>S.appts.find(a=>a.id===id),pt=id=>S.pts.find(p=>p.id===id);
function act(a,id,v){switch(a){
 case'open':S.open=S.open===id?'':id;break;case'clinic':S.c=v;S.done=null;S.bk.time='';S.q='';break;case'tab':S.tab=v;if(v!=='book')S.done=null;window.scrollTo&&scrollTo(0,0);break;case'lang':S.lang=v;break;
 case'bdate':S.bk.date=v;S.bk.time='';break;case'slot':S.bk.time=v;break;case'book':return doBook();case'again':S.done=null;break;case'dd':S.dd=v;break;
 case'remind':send('reminder',ap(id));toast('Simulated reminder logged in Messages');break;
 case'yes':reply(ap(id),'YES');toast('Simulated reply: YES — marked Confirmed');break;
 case'rs':reply(ap(id),'RESCHEDULE');toast('Simulated reply: RESCHEDULE — pick a new slot');break;
 case'move':toast(moveNext(ap(id))?'Moved to next free slot, new message logged':'No free slot found');break;
 case'ptremind':{const p=pt(id);send('followup',{c:p.c,name:p.name,phone:p.phone,date:p.fu});toast('Simulated follow-up reminder logged')}break;
 case'ptclear':pt(id).fu='';break;
 case'ordnew':{const pid=S.of.pid||(S.pts.find(p=>p.c==='ic')||{}).id,p=pt(pid);if(!p||!(+S.of.price>0))return toast('Choose a patient and enter a price');S.orders.unshift({id:uid(),c:'ic',pid,name:p.name,item:S.of.item,price:+S.of.price,stage:0});S.of.price='';toast('Order created')}break;
 case'ordnext':{const o=S.orders.find(x=>x.id===id);o.stage++;if(o.stage===2){send('ready',{c:'ic',name:o.name,phone:pt(o.pid).phone,item:o.item});toast('Ready — simulated WhatsApp logged')}}break;
 case'ordf':S.of.f=+v;break;case'tk':S.tk=v;break;
 case'tplsave':S.tpl[S.tk]={en:$('#t_en').value,hi:$('#t_hi').value};toast('Template saved');break;
 case'reset':if(!rc){rc=1;setTimeout(()=>{rc=0;render()},3000);break}rc=0;init();toast('Demo reset');break}
 render()}
function chg(k,id,v){if(k==='status'){ap(id).status=v;toast('Status: '+SL[v])}
 else if(k==='fu'){if(v==='')return;pt(id).fu=v==='0'?'':addDays(+v);toast('Follow-up updated')}else if(k==='ptfu'){pt(id).fu=v}render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el)act(el.dataset.a,el.dataset.id,el.dataset.v)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el)chg(el.dataset.ch,el.dataset.id,el.value)});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k)return;
 if(k==='search'){S.q=e.target.value;$('#plist').innerHTML=plist()}else if(k.startsWith('of_'))S.of[k.slice(3)]=e.target.value;else S.bk[k]=e.target.value;save()});
S=load();if(!S)init();render();
if(typeof window!=='undefined')window.__t={get S(){return S},doBook,send,reply,moveNext,taken,act};
</script></body></html>
